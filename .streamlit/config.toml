[server]
# Bind to loopback only: the dashboard has no authentication, so it must
# never be reachable from other machines on the network.
address = "localhost"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#fb8b1e"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#161616"
textColor = "#e8e6e1"
